# runtime
quarkus.freemarker.default-encoding=UTF-8
quarkus.freemarker.template-exception-handler=rethrow
quarkus.freemarker.log-template-exceptions=false
quarkus.freemarker.wrap-unchecked-exceptions=true
quarkus.freemarker.fallback-on-null-loop-variable=false
quarkus.freemarker.boolean-format=c
quarkus.freemarker.number-format=computer
quarkus.freemarker.object-wrapper-expose-fields=true
quarkus.freemarker.locale=fr-FR
quarkus.freemarker.time-zone=Europe/Paris
quarkus.freemarker.sql-date-and-time-time-zone=UTC
quarkus.freemarker.date-format=dd/MM/yyyy
quarkus.freemarker.time-format=HH:mm
quarkus.freemarker.datetime-format=dd/MM/yyyy HH:mm
quarkus.freemarker.output-encoding=UTF-8
quarkus.freemarker.url-escaping-charset=ISO-8859-1
quarkus.freemarker.settings.api_builtin_enabled=true
quarkus.freemarker.settings.boolean_format=oui,non

quarkus.freemarker.file-paths=src/test/external-templates

quarkus.log.level=INFO
quarkus.log.category."org.freemarker".level=DEBUG

# build time 
quarkus.freemarker.base-path=freemarker/mytemplates
quarkus.freemarker.includes=**
quarkus.freemarker.other-template-set.base-path=myothertemplates
quarkus.freemarker.other-template-set.includes=**
quarkus.freemarker.directives.base64=io.quarkiverse.it.freemarker.Base64Directive
quarkus.freemarker.directives.indent=io.quarkiverse.it.freemarker.IndentDirective

